<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お薬手帳</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: {
          50: "#eef7ff",
          100: "#dbeafe",
          600: "#1d6fef",
          700: "#1a5adb"
        }
      }
    }
  }
}
</script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

</head>


<body class="bg-slate-100 text-slate-800 min-h-screen">


<!-- ================= HEADER ================= -->

<header class="bg-brand-600 text-white shadow-md">

  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <div class="flex items-center gap-3">

      <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
        <i class="fa-solid fa-pills text-xl"></i>
      </div>

      <div>
        <h1 class="text-xl font-bold">
          お薬手帳
        </h1>
        <p class="text-xs opacity-80">
          Medication Manager
        </p>
      </div>

    </div>


    <button
      id="quick-add-btn"
      class="bg-white text-brand-600 px-4 py-2 rounded-xl font-bold flex items-center gap-2"
    >
      <i class="fa-solid fa-plus"></i>
      追加
    </button>


  </div>


  <!-- Navigation -->

  <nav class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar">

    <button
      class="nav-btn active-nav"
      data-view="dashboard"
    >
      <i class="fa-solid fa-house"></i>
      ホーム
    </button>


    <button
      class="nav-btn"
      data-view="list"
    >
      <i class="fa-solid fa-pills"></i>
      お薬一覧
    </button>


    <button
      class="nav-btn"
      data-view="add"
    >
      <i class="fa-solid fa-square-plus"></i>
      追加
    </button>


    <button
      class="nav-btn"
      data-view="doselog"
    >
      <i class="fa-solid fa-clipboard-check"></i>
      服用記録
    </button>


    <button
      class="nav-btn"
      data-view="stats"
    >
      <i class="fa-solid fa-chart-column"></i>
      統計
    </button>


    <button
      class="nav-btn relative"
      data-view="notifications"
    >
      <i class="fa-solid fa-bell"></i>
      通知

      <span
        id="notif-badge"
        class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full px-1.5"
      >
      </span>

    </button>


  </nav>


</header>



<!-- ================= MAIN ================= -->

<main class="max-w-7xl mx-auto p-4">


<!-- Toast -->

<div
 id="toast"
 class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium opacity-0 pointer-events-none transition-all z-50">
</div>



<!-- ============ DASHBOARD ============ -->

<section
 id="view-dashboard"
 class="view-section space-y-6"
>


<div class="grid grid-cols-2 md:grid-cols-4 gap-3">


<div class="stat-card">

<div class="stat-icon bg-brand-100 text-brand-600">
<i class="fa-solid fa-pills"></i>
</div>

<div>
<p id="stat-total" class="stat-num">0</p>
<p class="stat-label">登録中のお薬</p>
</div>

</div>



<div class="stat-card">

<div class="stat-icon bg-emerald-100 text-emerald-600">
<i class="fa-solid fa-capsules"></i>
</div>

<div>
<p id="stat-active" class="stat-num">0</p>
<p class="stat-label">服用中のお薬</p>
</div>

</div>



<div class="stat-card">

<div class="stat-icon bg-amber-100 text-amber-600">
<i class="fa-solid fa-triangle-exclamation"></i>
</div>

<div>
<p id="stat-low" class="stat-num">0</p>
<p class="stat-label">在庫が少ないお薬</p>
</div>

</div>



<div class="stat-card">

<div class="stat-icon bg-red-100 text-red-600">
<i class="fa-solid fa-circle-exclamation"></i>
</div>

<div>
<p id="stat-warning" class="stat-num">0</p>
<p class="stat-label">要注意のお薬</p>
</div>

</div>


</div>


<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">


<div class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">
<i class="fa-solid fa-calendar-day text-brand-600"></i>
本日の服用予定
</h2>

<div
id="today-schedule-list"
class="space-y-2 mt-3">
</div>


</div>



<div class="bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">
<i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
要注意のお薬
</h2>

<div
id="warning-med-list"
class="space-y-2 mt-3">
</div>

</div>


</div>



<div class="bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">

<i class="fa-solid fa-clock-rotate-left text-brand-600"></i>

最近の服用記録

</h2>


<div
id="recent-logs-list"
class="mt-3 divide-y divide-slate-100">
</div>


</div>



</section>
