<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お薬手帳アプリ</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: {
          50:"#eef7ff",
          100:"#dbeafe",
          500:"#3390fa",
          600:"#1d6fef",
          700:"#1a5adb"
        }
      }
    }
  }
}
</script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="bg-slate-100 text-slate-800">


<!-- ===============================
 LOGIN AREA
================================ -->

<div id="auth-area" class="min-h-screen flex items-center justify-center p-5">


<div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-md">


<!-- LOGIN -->

<div id="login-box">

<h1 class="text-2xl font-bold text-center mb-6">
<i class="fa-solid fa-pills text-brand-600"></i>
お薬手帳
</h1>


<label class="field-label">
メールアドレス
</label>

<input
id="login-email"
type="email"
class="input w-full mb-4"
placeholder="example@mail.com">


<label class="field-label">
パスワード
</label>

<input
id="login-password"
type="password"
class="input w-full mb-5"
placeholder="パスワード">


<button
id="login-btn"
class="btn-primary w-full">

<i class="fa-solid fa-right-to-bracket"></i>
ログイン

</button>


<button
id="show-register-btn"
class="text-sm text-brand-600 mt-5 w-full">

アカウントを作成する

</button>


</div>



<!-- REGISTER -->


<div id="register-box" class="hidden">


<h1 class="text-xl font-bold mb-5 text-center">

<i class="fa-solid fa-user-plus text-brand-600"></i>

会員登録

</h1>



<label class="field-label">
名前
</label>

<input
id="register-name"
type="text"
class="input w-full mb-3"
placeholder="名前">


<label class="field-label">
メールアドレス
</label>

<input
id="register-email"
type="email"
class="input w-full mb-3"
placeholder="example@mail.com">


<label class="field-label">
パスワード
</label>

<input
id="register-password"
type="password"
class="input w-full mb-5"
placeholder="6文字以上">


<button
id="register-btn"
class="btn-primary w-full">

<i class="fa-solid fa-user-check"></i>

登録する

</button>


<button
id="show-login-btn"
class="text-sm text-brand-600 mt-5 w-full">

ログインへ戻る

</button>


</div>


</div>

</div>





<!-- ===============================
 APP AREA
================================ -->

<div id="app-area" class="hidden min-h-screen">



<!-- HEADER -->

<header class="bg-brand-600 text-white shadow">


<div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">


<div>

<h1 class="text-xl font-bold">

<i class="fa-solid fa-pills"></i>

お薬手帳

</h1>


<p id="user-display"
class="text-xs opacity-80">

</p>

</div>



<button
id="logout-btn"
class="bg-white/20 px-4 py-2 rounded-xl text-sm">

<i class="fa-solid fa-right-from-bracket"></i>

ログアウト

</button>


</div>


</header>






<!-- NAVIGATION -->


<nav class="bg-brand-600 overflow-x-auto">


<div class="max-w-7xl mx-auto px-3 flex">


<button
class="nav-btn active-nav"
data-view="dashboard">

<i class="fa-solid fa-house"></i>
ホーム

</button>


<button
class="nav-btn"
data-view="list">

<i class="fa-solid fa-list"></i>
お薬一覧

</button>


<button
class="nav-btn"
data-view="add">

<i class="fa-solid fa-plus"></i>
追加

</button>


<button
class="nav-btn"
data-view="doselog">

<i class="fa-solid fa-clipboard-check"></i>
服用記録

</button>


<button
class="nav-btn"
data-view="stats">

<i class="fa-solid fa-chart-line"></i>
統計

</button>


<button
class="nav-btn"
data-view="notifications">

<i class="fa-solid fa-bell"></i>
通知

</button>


</div>

</nav>






<main class="max-w-7xl mx-auto p-4">


  <!-- Toast -->
<div id="toast"
class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium opacity-0 pointer-events-none transition-all z-50">
</div>


<!-- ================= DASHBOARD ================= -->

<section id="view-dashboard"
class="view-section space-y-6">


<div class="grid grid-cols-2 md:grid-cols-4 gap-3">


<div class="stat-card">
<div class="stat-icon bg-brand-100 text-brand-600">
<i class="fa-solid fa-pills"></i>
</div>

<div>
<p id="stat-total" class="stat-num">0</p>
<p class="stat-label">登録中のお薬</p>
</div>
</div>



<div class="stat-card">
<div class="stat-icon bg-emerald-100 text-emerald-600">
<i class="fa-solid fa-capsules"></i>
</div>

<div>
<p id="stat-active" class="stat-num">0</p>
<p class="stat-label">服用中のお薬</p>
</div>
</div>



<div class="stat-card">
<div class="stat-icon bg-amber-100 text-amber-600">
<i class="fa-solid fa-triangle-exclamation"></i>
</div>

<div>
<p id="stat-low" class="stat-num">0</p>
<p class="stat-label">在庫が少ないお薬</p>
</div>
</div>



<div class="stat-card">
<div class="stat-icon bg-red-100 text-red-600">
<i class="fa-solid fa-circle-exclamation"></i>
</div>

<div>
<p id="stat-warning" class="stat-num">0</p>
<p class="stat-label">要注意のお薬</p>
</div>
</div>


</div>





<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">


<div class="lg:col-span-2 bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">

<i class="fa-solid fa-calendar-day text-brand-600"></i>

本日の服用予定

</h2>


<div id="today-schedule-list"
class="space-y-2 mt-3">
</div>


</div>





<div class="bg-white rounded-2xl shadow-sm p-4">


<h2 class="section-title">

<i class="fa-solid fa-triangle-exclamation text-amber-500"></i>

要注意のお薬

</h2>


<div id="warning-med-list"
class="space-y-2 mt-3">
</div>


</div>


</div>





<div class="bg-white rounded-2xl shadow-sm p-4">


<h2 class="section-title">

<i class="fa-solid fa-clock-rotate-left text-brand-600"></i>

最近の服用記録

</h2>


<div id="recent-logs-list"
class="mt-3 divide-y divide-slate-100">
</div>


</div>



</section>





<!-- ================= MEDICATION LIST ================= -->

<section id="view-list"
class="view-section hidden space-y-4">



<div class="bg-white rounded-2xl shadow-sm p-4 flex flex-col md:flex-row gap-3 md:items-center">


<div class="relative flex-1">

<i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>


<input
id="search-input"
class="input pl-9 w-full"
placeholder="お薬の名前で検索...">

</div>




<select id="filter-category" class="input md:w-44">

<option value="all">
分類：すべて
</option>

<option value="処方薬">
処方薬
</option>

<option value="市販薬">
市販薬
</option>

<option value="個人輸入">
個人輸入
</option>

<option value="その他">
その他
</option>

</select>



<select id="filter-status" class="input md:w-40">

<option value="all">
状況：すべて
</option>

<option value="服用中">
服用中
</option>

<option value="休止中">
休止中
</option>

<option value="中止済み">
中止済み
</option>

</select>



<select id="sort-select" class="input md:w-48">

<option value="name_asc">
名前順
</option>

<option value="expiry_asc">
使用期限が近い順
</option>

<option value="stock_asc">
在庫が少ない順
</option>

<option value="created_desc">
登録が新しい順
</option>


</select>


</div>



<p id="list-count-label"
class="text-sm text-slate-500 px-1">
</p>


<div id="medication-cards-container"
class="med-grid">
</div>


<div id="list-empty-state"
class="hidden text-center py-16 text-slate-400">

<i class="fa-solid fa-pills text-5xl mb-3"></i>

<p>
登録されているお薬がありません
</p>

</div>


</section>





<!-- ================= ADD FORM ================= -->

<section id="view-add"
class="view-section hidden">


<div class="bg-white rounded-2xl shadow-sm p-5 max-w-3xl mx-auto">


<h2 id="add-form-title"
class="text-xl font-bold mb-5">

<i class="fa-solid fa-square-plus text-brand-600"></i>

お薬を追加

</h2>



<form id="medication-form"
class="space-y-6">


<div>

<label class="field-label">
お薬の名前 *
</label>


<input
id="med-name"
class="input w-full"
required
placeholder="例）ロキソニン">


</div>




<div>

<label class="field-label">
メモ
</label>


<textarea
id="med-memo"
class="input w-full"
rows="3">
</textarea>


</div>



<button
class="btn-primary w-full"
type="submit">

<i class="fa-solid fa-floppy-disk"></i>

保存する

</button>


</form>


</div>

</section>





<!-- ================= DOSE LOG ================= -->

<section id="view-doselog"
class="view-section hidden space-y-5">


<div class="bg-white rounded-2xl shadow-sm p-5">


<h2 class="text-lg font-bold">

<i class="fa-solid fa-clipboard-check text-brand-600"></i>

服用を記録する

</h2>


<form id="dose-log-form"
class="space-y-4 mt-4">


<select
id="log-med-select"
class="input w-full">

</select>



<input
id="log-amount"
class="input w-full"
placeholder="服用量">


<input
id="log-datetime"
type="datetime-local"
class="input w-full">


<button
class="btn-primary w-full">

記録する

</button>


</form>


</div>



<div class="bg-white rounded-2xl shadow-sm p-5">


<h2 class="text-lg font-bold">

服用履歴

</h2>


<div id="dose-log-history"
class="mt-4">

</div>


</div>


</section>





<!-- ================= STATS ================= -->

<section id="view-stats"
class="view-section hidden">


<div class="grid lg:grid-cols-2 gap-5">


<div class="bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">
服用回数
</h2>

<div class="chart-wrap">

<canvas id="chart-adherence"></canvas>

</div>

</div>



<div class="bg-white rounded-2xl shadow-sm p-4">

<h2 class="section-title">
分類別
</h2>

<div class="chart-wrap">

<canvas id="chart-category"></canvas>

</div>

</div>


</div>


</section>





<!-- ================= NOTIFICATIONS ================= -->

<section id="view-notifications"
class="view-section hidden">


<div class="bg-white rounded-2xl shadow-sm p-5">


<h2 class="text-lg font-bold">

<i class="fa-solid fa-bell text-brand-600"></i>

通知設定

</h2>



<div id="notif-expiry-list"
class="mt-4">

</div>



<div id="notif-stock-list"
class="mt-4">

</div>


</div>


</section>


</main>


</div>


<script src="app.js"></script>


</body>
</html>
